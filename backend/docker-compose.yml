services:
  mysql:
    image: mysql:8.4
    container_name: tsc-ecommerce-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tsc-ecommerce
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build: .
    container_name: tsc-ecommerce-api
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=mysql;Port=3306;Database=tsc-ecommerce;User=root;Password=root;
    ports:
      - "8080:8080"

volumes:
  mysql-data:
